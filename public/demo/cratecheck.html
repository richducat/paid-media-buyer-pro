<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="CrateCheck — DJ set intelligence: live decks with explicit-lyric warnings, BPM/key mix matching, real guest requests, emcee notes.">
<title>CrateCheck — DJ Set Intelligence (Demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
</head>
<body>
<style>
  :root{
    --bg:#0C0B13; --panel:#161522; --panel-2:#1D1B2C; --line:#262438;
    --ink:#F1EEE6; --muted:#8E89A0; --accent:#9D7BFF; --accent-ink:#14101F;
    --clean:#3DDC97; --caution:#FFB454; --explicit:#FF5468;
    --deckA:#9D7BFF; --deckB:#41D6C3;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  html{background:var(--bg)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  noscript{display:block; padding:40px 20px; text-align:center; color:var(--muted)}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  input{font:inherit}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}

  /* ---------- shell ---------- */
  #frame{
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    max-width:1180px; margin:0 auto; width:100%;
    height:100vh; height:100dvh; background:var(--bg);
  }
  .framed #frame{height:740px; margin:12px auto; border:1px solid var(--line); border-radius:18px}
  #scroller{flex:1 1 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 20px}
  header.top{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:14px 0 10px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:linear-gradient(var(--bg) 82%,transparent); z-index:20;
  }
  .brand{display:flex; flex-direction:column; gap:2px; margin-right:auto}
  .wordmark{font-weight:800; font-size:19px; letter-spacing:.06em; text-transform:uppercase; line-height:1}
  .wordmark em{font-style:normal; color:var(--accent)}
  .tagline{font-size:11.5px; color:var(--muted); letter-spacing:.02em}
  .modes{display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:4px}
  .modes button{padding:5px 12px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--muted); letter-spacing:.02em}
  .modes button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
  .helpbtn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    color:var(--muted); font-weight:800; font-size:14px;
  }
  .helpbtn:hover{color:var(--accent); border-color:var(--accent)}

  /* ---------- tab bar ---------- */
  nav.tabs{
    flex:none; z-index:30; background:#14131E; border-top:1px solid var(--line);
    padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
  }
  nav.tabs .row{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; max-width:640px; margin:0 auto}
  nav.tabs button{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:7px 4px 6px; border-radius:10px; color:var(--muted); font-size:11.5px; font-weight:600;
    letter-spacing:.03em; position:relative;
  }
  nav.tabs button svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  nav.tabs button[aria-current="page"]{color:var(--ink); background:var(--panel-2)}
  nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}
  .tab-badge{
    position:absolute; top:2px; right:calc(50% - 22px);
    background:var(--explicit); color:#fff; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; display:grid; place-items:center; padding:0 4px;
  }

  /* ---------- shared ---------- */
  h2.view-title{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:18px 0 10px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px}
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:6px; white-space:nowrap;
  }
  .pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
  .pill.clean{color:var(--clean); background:rgba(61,220,151,.12)}
  .pill.caution{color:var(--caution); background:rgba(255,180,84,.12)}
  .pill.explicit{color:var(--explicit); background:rgba(255,84,104,.13)}
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--muted);
    border:1px solid var(--line); border-radius:6px; padding:2px 8px;
  }
  .chip.good{color:var(--clean); border-color:rgba(61,220,151,.35)}
  .chip.accent{color:var(--accent); border-color:rgba(157,123,255,.4)}
  .btn{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2);
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .art{
    width:42px; height:42px; border-radius:8px; flex:none; display:grid; place-items:center;
    font-family:var(--mono); font-size:12px; font-weight:700; color:rgba(255,255,255,.85);
  }
  .footnote{font-size:11.5px; color:var(--muted); margin:14px 2px 0}
  .empty{padding:26px 18px; text-align:center; color:var(--muted); font-size:13.5px}
  .playedmark{color:var(--clean); font-size:11px; font-weight:800; margin-left:5px; letter-spacing:.02em}

  /* ---------- LIVE: decks ---------- */
  .live-decks{display:grid; grid-template-columns:1fr 128px 1fr; gap:12px; margin-top:14px; align-items:stretch}
  .deck{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px;
    display:flex; flex-direction:column; gap:8px; min-width:0;
  }
  .deck[data-deck="A"]{--dk:var(--deckA)}
  .deck[data-deck="B"]{--dk:var(--deckB)}
  .deck-top{display:flex; align-items:center; gap:10px; min-width:0}
  .deck-tag{
    flex:none; width:26px; height:26px; border-radius:7px; display:grid; place-items:center;
    font-family:var(--mono); font-weight:800; font-size:13px; color:var(--accent-ink); background:var(--dk);
  }
  .deck-meta{min-width:0; flex:1}
  .deck-title{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .deck-artist{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .deck-bpm{display:flex; gap:10px; align-items:baseline; flex:none}
  .deck-bpm b{font-family:var(--mono); font-size:20px; font-weight:700; line-height:1}
  .deck-bpm .kk{font-size:14px; color:var(--dk)}
  .deck-bpm span{font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
  .deck-mid{display:flex; gap:10px; align-items:center; min-width:0}
  .jog{
    width:118px; height:118px; flex:none; cursor:grab; touch-action:none; user-select:none;
    -webkit-user-select:none; position:relative;
  }
  .jog:active{cursor:grabbing}
  .jog-disc{
    width:100%; height:100%; border-radius:50%; position:relative; will-change:transform;
    background:
      repeating-radial-gradient(circle at center, #1B1A28 0 1.5px, #100F1A 1.5px 3.5px);
    border:2px solid var(--line);
    box-shadow:inset 0 0 18px rgba(0,0,0,.7), 0 2px 10px rgba(0,0,0,.5);
  }
  .jog-line{
    position:absolute; left:50%; top:5px; width:3px; height:24px; margin-left:-1.5px;
    background:var(--dk); border-radius:2px; box-shadow:0 0 6px var(--dk);
  }
  .jog-label{
    position:absolute; inset:0; margin:auto; width:46px; height:46px; border-radius:50%;
    display:grid; place-items:center; font-family:var(--mono); font-size:12px; font-weight:800;
    color:rgba(255,255,255,.9); border:2px solid rgba(0,0,0,.5);
  }
  .jog-label::after{
    content:""; position:absolute; width:6px; height:6px; border-radius:50%; background:#0C0B13;
    border:1px solid rgba(255,255,255,.25);
  }
  .wave-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
  .wave-main{width:100%; height:92px; display:block; background:#0F0E18; border-radius:8px}
  .wave-over{width:100%; height:24px; display:block; background:#0F0E18; border-radius:5px; cursor:pointer}
  .deck-times{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted)}
  .deck-flagnext{color:var(--caution)}
  .deck-ctl{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
  .dbtn{
    flex:none; height:36px; min-width:44px; padding:0 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2);
    font-size:11px; font-weight:800; letter-spacing:.06em; display:grid; place-items:center;
  }
  .dbtn.play{width:52px; font-size:14px}
  .dbtn.play[aria-pressed="true"]{background:var(--dk); border-color:var(--dk); color:var(--accent-ink)}
  .dbtn.cleanb[aria-pressed="true"]{background:var(--clean); border-color:var(--clean); color:var(--accent-ink)}
  .dbtn:disabled{opacity:.35; cursor:default}
  .pitch{display:flex; align-items:center; gap:7px; flex:1; min-width:120px}
  .pitch input{flex:1; accent-color:var(--dk); min-width:70px}
  .pitch span{font-size:11px; color:var(--muted); width:52px; text-align:right}
  .hotcues{display:flex; gap:6px; align-items:center}
  .hc{
    height:26px; min-width:40px; padding:0 8px; border-radius:6px; border:1px dashed var(--line);
    font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--muted);
  }
  .hc.set{border-style:solid; border-color:var(--dk); color:var(--dk)}
  .hc:disabled{opacity:.35; cursor:default}
  .hc-lab{font-size:9px; letter-spacing:.12em; color:var(--muted); margin-left:auto}

  /* ---------- LIVE: mixer ---------- */
  .mixer{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:10px;
  }
  .vu-pair{display:flex; gap:10px; align-items:flex-end; height:110px}
  .vu{width:12px; height:100%; background:#0F0E18; border-radius:4px; position:relative; overflow:hidden}
  .vu i{position:absolute; left:0; right:0; bottom:0; height:0%; border-radius:4px}
  .vu.a i{background:linear-gradient(180deg,var(--explicit),var(--deckA))}
  .vu.b i{background:linear-gradient(180deg,var(--explicit),var(--deckB))}
  .xfade-wrap{width:100%; display:flex; flex-direction:column; gap:4px; align-items:center}
  .xfade-wrap input{width:100%; accent-color:var(--accent)}
  .xfade-lab{display:flex; justify-content:space-between; width:100%; font-family:var(--mono); font-size:10px; color:var(--muted)}
  .onair{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); text-align:center}
  .onair b{color:var(--ink)}
  .mixer .dbtn{width:100%; height:30px; font-size:10px}
  .dbtn.amx[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .dbtn.klk[aria-pressed="true"]{color:var(--dk); border-color:var(--dk)}

  /* ---------- LIVE: alert + status ---------- */
  .alertbar{
    margin-top:10px; padding:10px 14px; border-radius:10px; font-size:13.5px; font-weight:600;
    display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
  }
  .alertbar.hard{background:rgba(255,84,104,.14); color:var(--explicit); animation:flash 1s steps(2) infinite}
  .alertbar.mild{background:rgba(255,180,84,.12); color:var(--caution)}
  @keyframes flash{50%{background:rgba(255,84,104,.3)}}
  .statusrow{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}
  .queue-strip{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; padding:2px}
  .queue-strip::-webkit-scrollbar{display:none}
  .queue-item{
    flex:none; display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:5px 8px; font-size:12px;
  }
  .queue-item .art{width:24px; height:24px; font-size:8px; border-radius:5px}
  .qbtn{
    font-family:var(--mono); font-size:10.5px; font-weight:800; width:22px; height:22px; border-radius:5px;
    border:1px solid var(--line); color:var(--muted);
  }
  .qbtn:hover{color:var(--ink); border-color:var(--accent)}

  /* ---------- LIVE: library ---------- */
  .livelib-head{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center}
  .livelib-head input{
    flex:1; min-width:160px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:9px 13px; color:var(--ink);
  }
  .livelib-head input::placeholder{color:var(--muted)}
  .sorts{display:flex; gap:5px}
  .sorts button{padding:6px 11px; border-radius:8px; border:1px solid var(--line); font-size:11.5px; font-weight:700; color:var(--muted)}
  .sorts button[aria-pressed="true"]{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .cratechips{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
  .cratechips button{
    padding:5px 11px; border-radius:99px; border:1px solid var(--line); font-size:11.5px; font-weight:600; color:var(--muted);
  }
  .cratechips button[aria-pressed="true"]{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .cratechips button.cleanonly[aria-pressed="true"]{background:var(--clean); border-color:var(--clean)}
  #libRows{margin-top:10px; display:flex; flex-direction:column; gap:6px}
  .librow{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); cursor:pointer;
  }
  .librow:hover{border-color:var(--accent)}
  .lib-main{min-width:0; flex:1}
  .song-title{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .song-artist{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .song-bpmkey{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; line-height:1.45; flex:none}
  .song-bpmkey .k{color:var(--muted)}
  .matchb{
    flex:none; width:44px; height:32px; border-radius:8px; display:grid; place-items:center;
    font-family:var(--mono); font-size:12px; font-weight:700; border:1.5px solid var(--line); color:var(--muted);
  }
  .matchb.hot{border-color:var(--accent); color:var(--accent)}
  .matchb.warm{border-color:var(--muted); color:var(--ink)}
  .loadbtns{display:flex; gap:5px; flex:none}
  .loadbtns button{
    font-family:var(--mono); font-weight:800; font-size:12px; width:34px; height:34px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2);
  }
  .loadbtns button:first-child:hover{border-color:var(--deckA); color:var(--deckA)}
  .loadbtns button:last-child:hover{border-color:var(--deckB); color:var(--deckB)}

  /* ---------- crates ---------- */
  .searchbar{display:flex; gap:8px; margin-top:16px}
  .searchbar input{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; color:var(--ink);
  }
  .searchbar input::placeholder{color:var(--muted)}
  ul.songs{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
  .song-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border-radius:14px; background:var(--panel); border:1px solid var(--line);
  }
  .song-row:hover{border-color:var(--accent)}
  .song-main{min-width:0; flex:1}
  .song-data{display:flex; align-items:center; gap:10px; flex:none}

  /* ---------- song sheet + overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:40; background:rgba(7,6,12,.7);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:640px; max-height:88%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); border-bottom:0;
    border-radius:20px 20px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));
  }
  .sheet-head{display:flex; gap:14px; align-items:center}
  .sheet-head .art{width:58px; height:58px; font-size:16px}
  .sheet-title{font-size:19px; font-weight:800; line-height:1.2}
  .sheet-sub{color:var(--muted); font-size:13px}
  .close-x{margin-left:auto; align-self:flex-start; color:var(--muted); font-size:22px; line-height:1; padding:4px 8px}
  .scanline{height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; margin:18px 0}
  .scanline i{display:block; height:100%; width:35%; border-radius:3px; background:var(--accent); animation:scan .8s linear infinite}
  @keyframes scan{from{transform:translateX(-110%)}to{transform:translateX(320%)}}
  .verdict{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; margin:16px 0 14px;
    font-weight:600; font-size:14px;
  }
  .verdict.clean{background:rgba(61,220,151,.1); color:var(--clean)}
  .verdict.caution{background:rgba(255,180,84,.1); color:var(--caution)}
  .verdict.explicit{background:rgba(255,84,104,.1); color:var(--explicit)}
  .verdict small{display:block; font-weight:500; color:var(--ink); opacity:.8; margin-top:2px; font-size:12.5px}
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0}
  .stat{background:var(--panel-2); border-radius:10px; padding:10px 12px}
  .stat b{display:block; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px}
  .stat span{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
  .moments{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column}
  .moments li{display:flex; gap:12px; align-items:baseline; padding:8px 2px; border-top:1px solid var(--line); font-size:13.5px}
  .moments .t{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--muted); flex:none; width:44px}
  .moments .cat{margin-left:auto; flex:none}
  .sheet-actions{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap}
  .sheet-actions .btn.dA{border-color:var(--deckA); color:var(--deckA)}
  .sheet-actions .btn.dB{border-color:var(--deckB); color:var(--deckB)}
  .help-list{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:12px; font-size:14px}
  .help-list b{display:block}
  .help-list span{color:var(--muted); font-size:13px}
  .kbd{
    font-family:var(--mono); font-size:11.5px; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:5px; padding:1px 6px; background:var(--panel-2);
  }

  /* ---------- mix ---------- */
  .mix-src-chips{display:flex; gap:6px; margin-top:14px}
  .mix-src-chips button{
    padding:8px 13px; border-radius:10px; border:1px solid var(--line); font-size:12.5px; font-weight:700; color:var(--muted);
    max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mix-src-chips button[aria-pressed="true"]{border-color:var(--accent); color:var(--ink); background:var(--panel-2)}
  .match-row{display:flex; align-items:center; gap:11px; padding:11px 12px; border-top:1px solid var(--line)}
  .match-row:first-child{border-top:0}
  .match-score{
    flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:13.5px;
    border:2px solid var(--line);
  }
  .match-score.hot{border-color:var(--accent); color:var(--accent)}
  .match-score.warm{border-color:var(--muted)}
  .match-main{min-width:0; flex:1}
  .match-chips{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px}

  /* ---------- requests ---------- */
  .req-head{display:flex; align-items:center; gap:10px; margin-top:16px}
  .req-toggle{margin-left:auto}
  .switch{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--muted)}

function verdictFor(s, mode){
  if(s.rating==="clean") return {cls:"clean", head:"Safe for any room.", sub:"No flagged content found in this track."};
  if(mode==="club"){

    return {cls:"clean", head:"Fine for this room.", sub:"Only mild flags — nothing unusual for a club set."};

function parseCam(c){ return {n:parseInt(c,10), l:c.slice(-1)}; }
function keyScore(a,b){

  if(A.n===B.n) return {s:44, label:"Relative major/minor"};

  if(d===1 && A.l===B.l) return {s:38, label:"Adjacent key"};
  if(d===2 && A.l===B.l) return {s:16, label:"Energy-jump key"};
  if(d===1) return {s:12, label:"Near key"};
  return {s:0, label:null};
}

  }
  let s=0;
  if(best.pct<=0.02)s=50; else if(best.pct<=0.04)s=42; else if(best.pct<=0.06)s=30; else if(best.pct<=0.09)s=14;
  const delta=Math.round(best.cand-a.bpm);
  let label = best.mode!=="straight" ? cap(best.mode)+" blend"
            : delta===0 ? "Same tempo" : (delta>0?"+":"")+delta+" BPM";
  return {s, label};
}
function cap(x){return x.charAt(0).toUpperCase()+x.slice(1)}
function scoreFor(src,s){ return keyScore(src,s).s + bpmScore(src,s).s; }
function matchesFor(src){
  return SONGS.filter(s=>s.id!==src.id).map(s=>{
    const k=keyScore(src,s), b=bpmScore(src,s);
    const chips=[];
    if(k.label) chips.push({txt:k.label, cls:k.s>=38?"good":""});
    chips.push({txt:b.label, cls:b.s>=42?"good":""});
    const de=s.energy-src.energy;
    if(de>0) chips.push({txt:"Energy +"+de, cls:"accent"});
    else if(de<0) chips.push({txt:"Energy "+de, cls:""});
    return {s, score:k.s+b.s, chips};
  }).filter(m=>m.score>=30).sort((x,y)=>y.score-x.score).slice(0,8);
}
function filterSongs(){
  const q=state.search.trim().toLowerCase();
  return SONGS.filter(s=>
    (!q || s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)) &&
    (state.crate==="all" || s.genre===state.crate) &&
    (!state.cleanOnly || s.rating==="clean" || s.clean));
}

/* ---------- deck engine ---------- */
function effBpm(dk){ const d=state.decks[dk], s=song(d.songId); return s ? s.bpm*(1+d.pitch/100) : 0; }
function onAir(){
  const A=state.decks.A, B=state.decks.B;
  if(A.playing && !B.playing) return "A";
  if(B.playing && !A.playing) return "B";
  if(A.playing && B.playing) return state.xfade<=50 ? "A" : "B";
  const side = state.xfade<=50 ? "A" : "B";
  if(state.decks[side].songId) return side;
  if(A.songId) return "A";
  if(B.songId) return "B";
  return null;
}
function loadToDeck(dk, id, opts){
  const s=song(id); if(!s) return;
  const wantClean = opts && "clean" in opts ? opts.clean
    : (strictMode() && s.rating!=="clean" && s.clean);
  state.decks[dk] = Object.assign(deckInit(), {songId:id, clean:!!wantClean && s.clean});
  toast(`Deck ${dk}: ${s.title}${state.decks[dk].clean?" (clean edit)":""}`);
  render();
}
function togglePlay(dk){
  const d=state.decks[dk]; if(!d.songId) return;
  d.playing=!d.playing;
  if(d.playing && d.pos>=sec(song(d.songId).dur)) d.pos=0;
  render();
}
function cueDeck(dk){
  const d=state.decks[dk]; if(!d.songId) return;
  d.pos=0; d.playing=false; render();
}
function hotCue(dk,i,clear){
  const d=state.decks[dk]; if(!d.songId) return;
  if(clear){ d.cues[i]=null; }
  else if(d.cues[i]===null){ d.cues[i]=d.pos; toast(`Deck ${dk}: hot cue ${i+1} set at ${fmt(d.pos)}`); }
  else { d.pos=d.cues[i]; }
  render();
}
function syncDeck(dk){
  const other = dk==="A" ? "B" : "A";
  const d=state.decks[dk], s=song(d.songId), target=effBpm(other);
  if(!s || !target){ toast("Nothing to sync to"); return; }
  let p=(target/s.bpm-1)*100;
  const clamped = Math.max(-8, Math.min(8, p));
  d.pitch = Math.round(clamped*10)/10;
  toast(Math.abs(p)>8 ? `Deck ${dk}: pitch maxed at ${d.pitch>0?"+":""}${d.pitch}% — out of range` :
    `Deck ${dk} synced to ${target.toFixed(1)} BPM`);
  render();
}
function toggleClean(dk){
  const d=state.decks[dk], s=song(d.songId);
  if(!s || !s.clean) return;
  d.clean=!d.clean;
  toast(`Deck ${dk}: ${d.clean?"clean edit":"album version"}`);
  render();
}
function setLoop(dk,beats){
  const d=state.decks[dk], s=song(d.songId); if(!s) return;
  const spb=60/s.bpm;
  if(d.loop && d.loop.beats===beats){ d.loop=null; toast(`Deck ${dk}: loop off`); }
  else{
    const start=Math.floor(d.pos/spb)*spb;
    d.loop={start, len:beats*spb, beats};
    toast(`Deck ${dk}: ${beats}-beat loop`);
  }
  render();
}
function beatJump(dk,beats){
  const d=state.decks[dk], s=song(d.songId); if(!s) return;
  d.pos=Math.max(0, Math.min(sec(s.dur), d.pos+beats*(60/s.bpm)));
  drawDeck(dk); updateDynamic(dk);
}
function toggleKeylock(dk){
  const d=state.decks[dk]; if(!d.songId) return;
  d.keylock=!d.keylock;
  toast(`Deck ${dk}: keylock ${d.keylock?"on — pitch keeps the key":"off — pitch bends the key"}`);
  render();
}
function suggestPick(){
  const oa=onAir();
  const src=oa ? song(state.decks[oa].songId) : null;
  const used=new Set([state.decks.A.songId, state.decks.B.songId].filter(Boolean));
  let best=null, bs=-1;
  for(const s of SONGS){
    if(used.has(s.id) || wasPlayed(s.id)) continue;
    if(strictMode() && s.rating!=="clean" && !s.clean) continue;
    const sc=src ? scoreFor(src,s) : s.energy*10;
    if(sc>bs){ bs=sc; best=s.id; }
  }
  return best;
}
function doSuggest(){
  const pick=suggestPick();
  if(!pick){ toast("Nothing left to suggest — crate exhausted"); return; }
  const oa=onAir();
  const idle = !state.decks.A.songId ? "A" : !state.decks.B.songId ? "B" : (oa==="A"?"B":"A");
  loadToDeck(idle, pick);
}
function addPlayed(id){
  if(state.played.length && state.played[state.played.length-1].id===id) return;
  state.played.push({id, at:new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})});
  state.played=state.played.slice(-60);
  saveSession();
}

/* seeded per-song waveform: [low, mid, high] per quarter-second */
function hash(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function waveFor(s){
  if(s._wave) return s._wave;
  let seed=hash(s.id)||1;
  const rand=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const n=Math.max(64, Math.round(sec(s.dur)*4));
  const arr=[]; let sectLen=0, base=0.5;
  for(let i=0;i<n;i++){
    if(sectLen<=0){ sectLen=Math.round((8+rand()*20)*4); base=0.35+rand()*0.6; }
    sectLen--;
    const lo=Math.min(1, base*(0.75+rand()*0.5));
    const mid=Math.min(1, lo*(0.55+rand()*0.5));
    const hi=Math.min(1, mid*(0.5+rand()*0.6));
    arr.push([lo,mid,hi]);
  }
  s._wave=arr; return arr;
}
const DECK_RGB = {A:"157,123,255", B:"65,214,195"};

function sizeCanvas(cv){
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const w=cv.clientWidth, h=cv.clientHeight;
  if(w && (cv.width!==Math.round(w*dpr) || cv.height!==Math.round(h*dpr))){
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  }
}
function drawMain(dk){
  const cv=$("#wmain-"+dk); if(!cv) return;
  sizeCanvas(cv);
  const ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const d=state.decks[dk], s=song(d.songId);
  if(!s){ ctx.fillStyle="rgba(142,137,160,.25)"; ctx.font=`${12*(W/cv.clientWidth||1)}px sans-serif`;
    ctx.textAlign="center"; ctx.fillText("NO TRACK LOADED", W/2, H/2+4); return; }
  const wave=waveFor(s), dur=sec(s.dur), bps=4, rgb=DECK_RGB[dk];
  const winSec=22, pxSec=W/winSec, t0=d.pos-winSec/2, mid=H/2;
  const spb=60/s.bpm;
  ctx.fillStyle="rgba(142,137,160,.12)";
  for(let b=Math.max(0,Math.ceil(t0/spb)); b*spb<Math.min(dur,t0+winSec); b++){
    ctx.fillRect((b*spb-t0)*pxSec, 0, 1, H);
  }
  const bw=Math.max(1, pxSec/bps - 1);
  for(let i=Math.max(0,Math.floor(t0*bps)); i<Math.min(wave.length, Math.ceil((t0+winSec)*bps)); i++){
    const t=i/bps, x=(t-t0)*pxSec, a=wave[i];
    const past = t < d.pos;
    ctx.fillStyle=`rgba(${rgb},${past?0.22:0.38})`;
    ctx.fillRect(x, mid-a[0]*H*0.46, bw, a[0]*H*0.92);
    ctx.fillStyle=`rgba(${rgb},${past?0.5:0.85})`;
    ctx.fillRect(x, mid-a[1]*H*0.33, bw, a[1]*H*0.66);
    ctx.fillStyle=`rgba(241,238,230,${past?0.3:0.5})`;
    ctx.fillRect(x, mid-a[2]*H*0.2, bw, a[2]*H*0.4);
  }
  for(const m of s.moments){
    if(m.cat==="Note") continue;
    const mt=sec(m.t); if(isNaN(mt)) continue;
    const x=(mt-t0)*pxSec, w=2*pxSec;
    if(x+w<0||x>W) continue;
    ctx.fillStyle = d.clean ? "rgba(61,220,151,.12)" : (m.sev==="hard"?"rgba(255,84,104,.22)":"rgba(255,180,84,.18)");
    ctx.fillRect(x,0,w,H);
    ctx.fillStyle = d.clean ? "rgba(61,220,151,.8)" : (m.sev==="hard"?"rgba(255,84,104,.9)":"rgba(255,180,84,.9)");
    ctx.fillRect(x,0,w,3);
  }
  // loop region
  if(d.loop){
    const x0=(d.loop.start-t0)*pxSec, x1=(d.loop.start+d.loop.len-t0)*pxSec;
    if(x1>0 && x0<W){
      ctx.fillStyle=`rgba(${rgb},.14)`;
      ctx.fillRect(x0,0,x1-x0,H);
      ctx.fillStyle=`rgba(${rgb},1)`;
      ctx.fillRect(x0,0,2,H); ctx.fillRect(x1-2,0,2,H);
    }
  }
  // hot cue markers
  for(let i=0;i<3;i++){
    const c=d.cues[i]; if(c===null) continue;
    const x=(c-t0)*pxSec;
    if(x<0||x>W) continue;
    ctx.fillStyle=`rgba(${rgb},.95)`;
    ctx.fillRect(x-1,0,2,H*0.25);
    ctx.font=`bold ${H*0.16}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign="left";
    ctx.fillText(String(i+1), x+3, H*0.18);
  }
  ctx.fillStyle="#F1EEE6";
  ctx.fillRect(W/2-1,0,2,H);
}
function drawOver(dk){
  const cv=$("#wover-"+dk); if(!cv) return;
  sizeCanvas(cv);
  const ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const d=state.decks[dk], s=song(d.songId);
  if(!s) return;
  const wave=waveFor(s), dur=sec(s.dur), rgb=DECK_RGB[dk], mid=H/2;
  const step=Math.max(1, Math.floor(wave.length/ (W/2)));
  for(let i=0;i<wave.length;i+=step){
    const x=i/wave.length*W, t=i/4;
    ctx.fillStyle = t<d.pos ? `rgba(${rgb},.85)` : "rgba(142,137,160,.35)";
    const h=wave[i][0]*H*0.85;
    ctx.fillRect(x, mid-h/2, Math.max(1,W/wave.length*step-0.5), h);
  }
  for(const m of s.moments){
    if(m.cat==="Note") continue;
    const mt=sec(m.t); if(isNaN(mt)) continue;
    ctx.fillStyle = d.clean ? "rgba(61,220,151,.9)" : (m.sev==="hard"?"#FF5468":"#FFB454");
    ctx.fillRect(mt/dur*W-1, 0, 2.5, H);
  }
  ctx.fillStyle="#F1EEE6";
  ctx.fillRect(d.pos/dur*W-1, 0, 2, H);
}
function drawDeck(dk){ drawMain(dk); drawOver(dk); }

/* per-frame dynamic bits (never rebuilds DOM) */
function updateDynamic(dk){
  const d=state.decks[dk], s=song(d.songId);
  const pos=$("#dpos-"+dk), rem=$("#drem-"+dk), flag=$("#dflag-"+dk);
  if(!pos) return;
  if(!s){ pos.textContent="0:00"; rem.textContent="-0:00"; flag.textContent=""; return; }
  pos.textContent=fmt(d.pos);
  rem.textContent="-"+fmt(sec(s.dur)-d.pos);
  const jd=$("#jogdisc-"+dk);
  if(jd) jd.style.transform="rotate("+((d.pos/1.8*360)%360).toFixed(1)+"deg)";  // 33⅓ RPM
  let next=null;
  if(strictMode() && !d.clean){
    for(const m of s.moments){
      if(m.cat==="Note") continue;
      const mt=sec(m.t);
      if(!isNaN(mt) && mt>d.pos && (!next||mt<next)) next=mt;
    }
  }
  flag.textContent = next!==null ? `next flag in ${fmt(next-d.pos)}` : "";
}
function updateAlert(){
  const el=$("#alertBar"); if(!el) return;
  let best=null;
  if(strictMode()){
    for(const dk of ["A","B"]){
      const d=state.decks[dk], s=song(d.songId);
      if(!s||!d.playing||d.clean) continue;
      for(const m of s.moments){
        if(m.cat==="Note") continue;
        const mt=sec(m.t); if(isNaN(mt)) continue;
        const dt=mt-d.pos;
        if(dt>0 && dt<=15 && (!best||dt<best.dt)) best={dk,m,dt,s};
      }
    }
  }
  if(best){
    el.hidden=false;
    el.className="alertbar "+(best.m.sev==="hard"?"hard":"mild");
    el.innerHTML=`<span aria-hidden="true">⚠</span> <b>DECK ${best.dk}</b> — ${esc(best.m.cat)}: ${esc(best.m.label)} in <b class="num">${fmt(best.dt)}</b> · ${best.s.clean?"hit CLEAN on the deck":"no clean edit — fade or cut"}`;
  } else el.hidden=true;
}
function updateVU(){
  for(const dk of ["A","B"]){
    const el=$("#vu-"+dk); if(!el) continue;
    const d=state.decks[dk], s=song(d.songId);
    let lvl=0;
    if(s && d.playing){
      const wave=waveFor(s), i=Math.min(wave.length-1, Math.floor(d.pos*4));
      const weight = dk==="A" ? Math.min(1,(100-state.xfade)/50) : Math.min(1,state.xfade/50);
      lvl=wave[i][0]*weight;
    }
    el.style.height=Math.round(lvl*100)+"%";
  }
  const lab=$("#onairLabel");
  if(lab){ const oa=onAir(); lab.innerHTML = oa ? `ON AIR <b>DECK ${oa}</b><br>${effBpm(oa).toFixed(1)} BPM` : "ON AIR —"; }
}

/* Playback clock runs off real elapsed time on a timer (still fires in
   backgrounded tabs); rAF only makes the drawing smooth when visible. */
let lastAdv=performance.now();
let drawnOnce=false;
function advance(){
  const now=performance.now();
  const dt=Math.max(0, Math.min(1,(now-lastAdv)/1000));
  lastAdv=now;
  for(const dk of ["A","B"]){
    const d=state.decks[dk], s=song(d.songId);
    if(!s||!d.playing) continue;
    d.pos += dt*(1+d.pitch/100);
    if(d.loop && d.pos>=d.loop.start+d.loop.len){
      d.pos=d.loop.start+((d.pos-d.loop.start)%d.loop.len);
    }
    if(!d.logged && d.pos>=15){ d.logged=true; addPlayed(s.id); }
    const dur=sec(s.dur);
    if(d.pos>=dur){
      d.pos=dur; d.playing=false;
      if(state.queue.length){
        const nextId=state.queue.shift();
        saveSession();
        loadToDeck(dk, nextId);         // calls render()
        toast(`Deck ${dk}: track ended — loaded next from queue`);
      } else { render(); }
    }
  }
  runAutomix(dt);
  if(state.view==="live") redrawLive(false);
}
/* Automix: as the on-air track runs out, prep the other deck (queue first,
   then best suggestion), sync it, start it, and glide the crossfader over. */
let amxFadeTarget=null;
function runAutomix(dt){
  if(!state.automix){ amxFadeTarget=null; return; }
  const oa=onAir();
  if(oa){
    const d=state.decks[oa], s=song(d.songId);
    if(s && d.playing && !d.loop){
      const rem=sec(s.dur)-d.pos;
      const other = oa==="A"?"B":"A", od=state.decks[other];
      if(rem<=12){
        if(!od.songId){
          const nid=state.queue.length ? state.queue.shift() : suggestPick();
          if(nid){ saveSession(); loadToDeck(other, nid); }
        }
        if(od.songId && !od.playing){
          const s2=song(od.songId);
          od.pitch=Math.round(Math.max(-8,Math.min(8,(effBpm(oa)/s2.bpm-1)*100))*10)/10;
          od.pos=0; od.logged=false; od.playing=true;
          amxFadeTarget = other==="A" ? 0 : 100;
          toast("Automix: blending to Deck "+other);
          render();
        }
      }
    }
  }
  if(amxFadeTarget!==null){
    const dir=Math.sign(amxFadeTarget-state.xfade);
    if(dir===0){ amxFadeTarget=null; return; }
    state.xfade=Math.max(0, Math.min(100, state.xfade+dir*dt*(100/8)));
    if(Math.abs(state.xfade-amxFadeTarget)<0.6){ state.xfade=amxFadeTarget; amxFadeTarget=null; }
    const xf=$("#xfade"); if(xf) xf.value=state.xfade;
  }
}
function redrawLive(force){
  const anyPlaying = state.decks.A.playing || state.decks.B.playing;
  if(anyPlaying || force || !drawnOnce){
    drawDeck("A"); drawDeck("B"); drawnOnce=true;
  }
  updateDynamic("A"); updateDynamic("B");
  updateAlert(); updateVU();
}
function tick(){ advance(); requestAnimationFrame(tick); }

/* ---------- live requests: real API with simulated fallback ---------- */
function mapRemote(r){
  const known = song(r.songId) ? r.songId : null;
  return {
    id:"srv"+r.id, name:(r.name||"Guest").slice(0,40), song:known,
    songText:known?"":(r.songText||r.songId||"Unknown song").slice(0,80),
    note:(r.note||"").slice(0,140), tip:+r.tip||0,
    hue:(r.id*137)%360, time:ago(r.ts||Date.now()), status:r.status||"pending",
  };
}
function mergeRemote(list){
  const known=new Set(state.requests.map(r=>r.id));
  const mapped=list.map(mapRemote);
  const fresh=mapped.filter(m=>!known.has(m.id) && m.status==="pending");
  state.requests=mapped;
  if(fresh.length){
    if(state.view==="requests") render(); else renderTabs();
    toast("New request: "+(fresh[0].song?song(fresh[0].song).title:fresh[0].songText));
  } else if(!known.size && mapped.length){
    if(state.view==="requests") render(); else renderTabs();
  }
}
async function pollRequests(){
  try{
    const r=await fetch(API, {cache:"no-store"});
    if(!r.ok) throw new Error("http "+r.status);
    const data=await r.json();
    serverMode=true;
    mergeRemote(Array.isArray(data.requests)?data.requests:[]);
  }catch(e){
    if(!serverMode && !simStarted) startSim();
    if(!serverMode && pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  }
}
async function pushStatus(localId, status){
  if(!serverMode || !localId.startsWith("srv")) return;
  try{
    await fetch(API, {method:"PATCH", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:+localId.slice(3), status})});
  }catch(e){}
}
function startSim(){
  simStarted=true;
  spawnRequest(true); spawnRequest(true); spawnRequest(true);
  if(state.requests[0]) state.requests[0].time="Just now";
  renderTabs();
  if(state.view==="requests") render();
  setInterval(()=>{ if(state.requestsOpen && state.requests.filter(r=>r.status==="pending").length<6) spawnRequest(false); },15000);
}
function spawnRequest(initial){
  const pick=REQUEST_POOL[reqCounter%REQUEST_POOL.length];
  reqCounter++;
  state.requests.unshift({
    id:"r"+reqCounter, name:pick.name, song:pick.song, songText:"", note:pick.note, tip:pick.tip,
    hue:(reqCounter*137)%360, time:initial?(reqCounter*3)+" min ago":"Just now", status:"pending",
  });
  if(!initial){
    if(state.view==="requests") render(); else renderTabs();
    toast("New request: "+song(pick.song).title);
  }
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- tabs + modes ---------- */
const TABS=[
  {id:"live", label:"Live", icon:"M2.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0M12.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0M7 12h.01M17 12h.01"},
  {id:"crates", label:"Crates", icon:"M4 7h16M4 7v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7M4 7l2-3h12l2 3M10 11h4"},
  {id:"mix", label:"Mix", icon:"M7 4v16M7 14h.01M17 4v16M17 9h.01M4 14h6M14 9h6"},
  {id:"requests", label:"Requests", icon:"M21 12a8 8 0 0 1-8 8H4l2.5-2.5A8 8 0 1 1 21 12ZM9 10h6M9 13h4"},

];
function renderTabs(){
  const pending = state.requests.filter(r=>r.status==="pending").length;
  $("#tabRow").innerHTML = TABS.map(t=>{
    const badge = t.id==="requests" && pending && state.view!=="requests"
      ? `<span class="tab-badge">${pending}</span>` : "";
    return `<button data-tab="${t.id}" ${state.view===t.id?'aria-current="page"':""}>
      ${badge}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${t.icon}"/></svg>${t.label}</button>`;

}
function renderModes(){

    `<button data-mode="${m.id}" aria-pressed="${state.mode===m.id}">${m.label}</button>`).join("");
}
function render(){
  renderModes(); renderTabs();
  const v=$("#view");
  if(state.view==="live") v.innerHTML=viewLive();
  else if(state.view==="crates") v.innerHTML=viewCrates();
  else if(state.view==="mix") v.innerHTML=viewMix();
  else if(state.view==="requests") v.innerHTML=viewRequests();
  else v.innerHTML=viewEmcee();
  if(state.view==="live") redrawLive(true);
}

function liveLibRows(){
  const oa=onAir();
  const src=oa ? song(state.decks[oa].songId) : null;
  let rows=filterSongs().map(s=>({s, m:(src&&s.id!==src.id)?scoreFor(src,s):null}));
  if(state.libSort==="match") rows.sort((a,b)=>(b.m??-1)-(a.m??-1));
  else if(state.libSort==="bpm") rows.sort((a,b)=>a.s.bpm-b.s.bpm);
  else rows.sort((a,b)=>a.s.title.localeCompare(b.s.title));
  if(!rows.length) return `<div class="empty">Nothing matches those filters.</div>`;

  closeSheet();
  const ov=document.createElement("div");
  ov.className="overlay"; ov.id="sheetOverlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.title)} details">

function fillSheet(s){
  const body=$("#sheetBody"); if(!body) return;
  const v=verdictFor(s,state.mode);
  const cats={};
  s.moments.forEach(m=>{ if(m.cat!=="Note") cats[m.cat]=(cats[m.cat]||0)+1; });
  const catLine=Object.keys(cats).length
    ? Object.entries(cats).map(([c,n])=>`${c} ×${n}`).join(" · ") : "No flags";
  body.innerHTML=`
    <div class="verdict ${v.cls}"><span aria-hidden="true">${v.cls==="clean"?"✓":v.cls==="caution"?"◐":"✕"}</span>
      <div>${esc(v.head)}<small>${esc(v.sub)}</small></div></div>
    <div class="statgrid">
      <div class="stat"><b>${s.bpm}</b><span>BPM</span></div>
      <div class="stat"><b>${s.cam}</b><span>${esc(s.key)}</span></div>
      <div class="stat"><b>${s.energy}/10</b><span>Energy</span></div>
      <div class="stat"><b>${s.dur}</b><span>Length</span></div>
      <div class="stat"><b>${s.moments.filter(m=>m.cat!=="Note").length}</b><span>Flags</span></div>
      <div class="stat"><b>${s.clean?"Yes":"—"}</b><span>Clean edit</span></div>
    </div>
    <h2 class="view-title" style="margin-top:18px">Flagged moments · ${esc(catLine)}</h2>
    ${s.moments.length?`<ul class="moments">${s.moments.map(m=>`
      <li><span class="t num">${m.t}</span><span>${esc(m.label)}</span>
      <span class="cat pill ${m.sev==="hard"?"explicit":"caution"}">${esc(m.cat)}</span></li>`).join("")}</ul>`
      :`<div class="empty">Nothing flagged. Full send.</div>`}
    <div class="sheet-actions">
      <button class="btn dA" data-loada="${s.id}">Load ▸ Deck A</button>
      <button class="btn dB" data-loadb="${s.id}">Load ▸ Deck B</button>
      <button class="btn" data-mix="${s.id}">Find mixes</button>
    </div>`;
}

function guestUrl(){

function viewRequests(){

  const strict=strictMode();
  return `

      <h2 class="view-title" style="margin:0">Live requests</h2>

      <h2 class="view-title">Up next · ${state.queue.length}</h2>
      <div class="queue-strip">${state.queue.map((id,i)=>{const s=song(id);return `

          <button class="qbtn" data-qdel="${i}" aria-label="Remove from queue">×</button></span>`;}).join("")}
      </div>`:""}
    ${pending.length===0&&done.length===0?`<div class="card empty" style="margin-top:12px">No requests yet.${state.requestsOpen?" Share the link above — new requests pop in here instantly.":""}</div>`:""}
    ${pending.map(reqCard).join("")}
    ${done.length?`<h2 class="view-title">Handled</h2>${done.map(reqCard).join("")}`:""}
    <p class="footnote">${serverMode
      ?"Live mode: requests come from the guest page and sync every few seconds."
      :"Preview build simulates incoming guest requests. Deploy next to its API and this becomes a real cross-device request line."}
      Accepted requests join Up Next and auto-load when a deck runs out.</p>`;

  function reqCard(r){
    const s=r.song?song(r.song):null;
    const warn = s && strict && s.rating!=="clean";
    const played = s && wasPlayed(s.id);
    return `<div class="card req-card">
      <div class="req-who">
        <span class="avatar" style="background:hsl(${r.hue} 45% 40%)">${initials(r.name)}</span>

        <span class="req-time">${esc(r.time)}</span>
      </div>
      <div class="req-song">
        ${s?`<span class="art" style="${artStyle(s)}">${initials(s.title)}</span>
        <div class="song-main">
          <div class="song-title">${esc(s.title)}</div>
          <div class="song-artist">${esc(s.artist)} · <span class="num">${s.bpm} BPM · ${s.cam}</span></div>
        </div>
        <span class="pill ${s.rating}">${RATING_LABEL[s.rating]}</span>`
        :`<span class="art" style="background:var(--panel-2)">?</span>
        <div class="song-main">
          <div class="song-title">${esc(r.songText||"Unknown song")}</div>
          <div class="song-artist">Not in your crates — search your library</div>
        </div>`}
      </div>
      ${r.note?`<div class="req-note">“${esc(r.note)}”</div>`:""}
      ${played?`<div class="req-warn"><span aria-hidden="true">↻</span><span>Already played tonight — check the set log.</span></div>`:""}
      ${warn?`<div class="req-warn"><span aria-hidden="true">⚠</span><span>${s.rating==="explicit"
          ?(s.clean?"Dirty version — accept queues the <b>clean edit</b> automatically.":"Explicit with no clean edit — decline or own the consequences.")
          :"Mild flags for this room — tap the song in Crates to review."}</span></div>`:""}
      ${r.status==="pending"?`
        <div class="req-actions">
          <button class="btn primary" data-accept="${r.id}">Accept${warn&&s&&s.clean?" (clean)":""}</button>
          <button class="btn" data-decline="${r.id}">Decline</button>
        </div>`
      :`<div class="req-done ${r.status==="accepted"?"ok":"no"}">${r.status==="accepted"?"✓ In queue":"Declined"}</div>`}
    </div>`;
  }
}

        </ul>
        <form class="note-add" data-card="${ci}">
          <input type="text" placeholder="Add to ${esc(card.title.toLowerCase())}…" aria-label="Add note to ${esc(card.title)}">
          <button class="btn" type="submit">Add</button>
        </form>
      </div>`).join("")}
    <div class="card note-card">
      <h3><span class="dot" style="background:var(--deckB)"></span>Set log · ${state.played.length} played</h3>
      ${state.played.length?`<ul class="setlog">${state.played.slice().reverse().map(p=>{
        const s=song(p.id); return `<li><span class="t">${esc(p.at)}</span><span>${s?esc(s.title):esc(p.id)}</span>
          <span class="song-artist" style="margin-left:auto">${s?esc(s.artist):""}</span></li>`;}).join("")}</ul>`
      :`<div class="empty" style="padding:14px">Tracks log here automatically after 15 seconds of play.</div>`}
    </div>
    <p class="footnote">Notes and the set log save on this device automatically. The first Timeline item is pinned to the Live screen.</p>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const seekCv=e.target.closest("canvas[data-seek]");
  if(seekCv){
    const dk=seekCv.dataset.seek, d=state.decks[dk], s=song(d.songId);
    if(s){
      const r=seekCv.getBoundingClientRect();
      d.pos=Math.max(0, Math.min(1,(e.clientX-r.left)/r.width))*sec(s.dur);
      drawDeck(dk); updateDynamic(dk);
    }
    return;
  }
  const el=e.target.closest("button, form");
  if(el){
    const d=el.dataset||{};
    if(d.tab){ closeSheet(); state.view=d.tab; render(); $("#scroller").scrollTo({top:0}); return; }
    if(d.mode){ state.mode=d.mode; saveSession(); render(); toast(MODES.find(m=>m.id===d.mode).label+" mode — verdicts updated"); return; }
    if(el.hasAttribute("data-help")){ openHelp(); return; }
    if(el.hasAttribute("data-close")){ closeSheet(); return; }
    if(el.hasAttribute("data-copylink")){
      const url=guestUrl();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=>toast("Guest link copied"),()=>toast(url));
      } else toast(url);
      return;
    }
    if(d.loada){ closeSheet(); loadToDeck("A", d.loada); return; }
    if(d.loadb){ closeSheet(); loadToDeck("B", d.loadb); return; }
    if(d.mix){ closeSheet(); state.view="mix"; state.mixSrc=null;
      const oa=onAir();
      if(!oa || state.decks[oa].songId!==d.mix){
        const idle = state.decks.A.playing ? "B" : (state.decks.B.playing ? "A" : (state.xfade<=50?"B":"A"));
        loadToDeck(idle, d.mix); state.mixSrc=idle;
      }
      render(); $("#scroller").scrollTo({top:0}); return; }
    if(d.mixsrc){ state.mixSrc=d.mixsrc; render(); return; }
    if(d.play){ togglePlay(d.play); return; }
    if(d.cue){ cueDeck(d.cue); return; }
    if(d.sync){ syncDeck(d.sync); return; }
    if(d.clean){ toggleClean(d.clean); return; }
    if(d.hotcue){ const [dk,i]=d.hotcue.split(":"); hotCue(dk,+i,e.shiftKey); return; }
    if(d.loop){ const [dk,n]=d.loop.split(":"); setLoop(dk,+n); return; }
    if(d.bjump){ const [dk,n]=d.bjump.split(":"); beatJump(dk,+n); return; }
    if(d.keylock){ toggleKeylock(d.keylock); return; }
    if(el.hasAttribute("data-automix")){
      state.automix=!state.automix; saveSession();
      toast("Automix "+(state.automix?"on — hands-free blending":"off"));
      render(); return;
    }
    if(el.hasAttribute("data-suggest")){ doSuggest(); return; }
    if(d.sort){ state.libSort=d.sort; saveSession(); render(); return; }
    if(d.crate){ state.crate=d.crate; saveSession(); render(); return; }
    if(el.hasAttribute("data-cleanonly")){ state.cleanOnly=!state.cleanOnly; saveSession(); render(); return; }
    if(d.qload){ const [dk,i]=d.qload.split(":"); const id=state.queue[+i];
      if(id){ state.queue.splice(+i,1); saveSession(); loadToDeck(dk,id); } return; }
    if(d.qdel){ state.queue.splice(+d.qdel,1); saveSession(); render(); return; }
    if(d.song){ openSheet(d.song); return; }
    if(d.accept){
      const r=state.requests.find(x=>x.id===d.accept);
      if(r){
        r.status="accepted";
        if(r.song){ state.queue.push(r.song); saveSession(); toast("Queued: "+song(r.song).title); }
        else toast("Accepted — find it in your library");
        pushStatus(r.id,"accepted");
        render();
      }
      return;
    }
    if(d.decline){
      const r=state.requests.find(x=>x.id===d.decline);
      if(r){ r.status="declined"; pushStatus(r.id,"declined"); render(); }
      return;
    }
    if(el.id==="reqToggle"){ state.requestsOpen=!state.requestsOpen; render(); return; }
    if(el.id==="resetNotes"){
      state.notes=JSON.parse(JSON.stringify(DEFAULT_NOTES)); saveNotes(); render(); toast("Demo notes restored");
      return;
    }
    if(d.del){
      const [ci,ii]=d.del.split(":").map(Number);
      state.notes[ci].items.splice(ii,1); saveNotes(); render();
      return;
    }
    return;
  }
  const row=e.target.closest(".librow[data-song]");
  if(row){ openSheet(row.dataset.song); return; }
  if(e.target.id==="sheetOverlay") closeSheet();
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ closeSheet(); return; }
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("librow")){
    e.preventDefault(); openSheet(e.target.dataset.song); return;
  }
  if(state.view!=="live") return;
  if(e.key===" "){ e.preventDefault(); const oa=onAir(); if(oa) togglePlay(oa); return; }
  if(e.key==="1"){ togglePlay("A"); return; }
  if(e.key==="2"){ togglePlay("B"); return; }
});
document.addEventListener("submit", e=>{
  const f=e.target.closest("form.note-add"); if(!f) return;
  e.preventDefault();
  const input=f.querySelector("input"), val=input.value.trim();
  if(!val) return;
  state.notes[Number(f.dataset.card)].items.push(val);
  saveNotes(); render();
});
document.addEventListener("input", e=>{
  const t=e.target, d=t.dataset||{};
  if(t.id==="searchInput" || t.id==="liveSearch"){
    state.search=t.value;
    if(state.view==="live"){
      const rows=$("#libRows"); if(rows) rows.innerHTML=liveLibRows();
    } else {
      const list=filterSongs();
      const ul=document.querySelector("ul.songs");
      const title=$("#crateCount");
      if(ul) ul.innerHTML=list.map(songRow).join("")||`<div class="empty">Nothing matches those filters.</div>`;
      if(title) title.textContent=`Your crates · ${list.length} tracks`;
    }
    return;
  }
  if(d.pitch){
    state.decks[d.pitch].pitch=parseFloat(t.value)||0;
    const pv=$("#dpitchval-"+d.pitch), bv=$("#dbpmval-"+d.pitch);
    if(pv) pv.textContent=(state.decks[d.pitch].pitch>0?"+":"")+state.decks[d.pitch].pitch.toFixed(1)+"%";
    if(bv) bv.textContent=effBpm(d.pitch).toFixed(1);
    updateVU();
    return;
  }
  if(t.id==="xfade"){ state.xfade=+t.value; updateVU(); return; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="xfade" && state.view==="live"){
    const rows=$("#libRows"); if(rows) rows.innerHTML=liveLibRows();
    updateVU();
  }
});
window.addEventListener("resize", ()=>{ if(state.view==="live"){ drawnOnce=false; } });

/* turntable scratching: drag the platter to scrub (1 revolution = 1.8s, like 33⅓ vinyl) */
let scratch=null;
function jogAngle(e, el){
  const r=el.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2));
}
document.addEventListener("pointerdown", e=>{
  const j=e.target.closest("[data-jog]"); if(!j) return;
  const dk=j.dataset.jog;
  if(!state.decks[dk].songId) return;
  e.preventDefault();
  scratch={dk, el:j, last:jogAngle(e,j)};
  try{ j.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener("pointermove", e=>{
  if(!scratch) return;
  const d=state.decks[scratch.dk], s=song(d.songId);
  if(!s){ scratch=null; return; }
  const a=jogAngle(e, scratch.el);
  let da=a-scratch.last;
  if(da>Math.PI) da-=2*Math.PI;
  if(da<-Math.PI) da+=2*Math.PI;
  scratch.last=a;
  d.pos=Math.max(0, Math.min(sec(s.dur), d.pos + da/(2*Math.PI)*1.8));
  drawDeck(scratch.dk); updateDynamic(scratch.dk);
});
document.addEventListener("pointerup", ()=>{ scratch=null; });
document.addEventListener("pointercancel", ()=>{ scratch=null; });

/* ---------- boot ---------- */
loadSession();
state.decks.A=Object.assign(deckInit(), {songId:"september", playing:true, pos:38});
state.decks.B=Object.assign(deckInit(), {songId:"iwanna"});
render();
requestAnimationFrame(tick);
setInterval(advance, 500);
pollRequests();
pollTimer=setInterval(pollRequests, 5000);

/* test/debug hook */
window.CC={state, loadToDeck, song, sec, effBpm, onAir, mergeRemote, get serverMode(){return serverMode}};
</script>

</body>
